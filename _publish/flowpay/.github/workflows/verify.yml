name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libssl-dev
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: flowpay-linux-binaries
          path: |
            backend/target/release/flowpay-api-server
            backend/target/release/flowpay-worker
            backend/target/release/flowpay-event-relay

  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std@v1.9.7 --no-git --shallow
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vvv

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [merchant, checkout]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
